services:
  postgres:
    image: postgres:16-alpine
    container_name: ggs-document-studio-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ggs_document_studio
      POSTGRES_USER: ggs
      POSTGRES_PASSWORD: desarrollo-local
    volumes:
      - ggs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggs -d ggs_document_studio"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ggs_postgres_data:
